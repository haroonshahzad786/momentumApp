<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moore Momentum">

  <!-- iOS meta tags & icons -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moore Momentum">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moore Momentum</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start fetching the intro art while the engine is still booting, so it is
       already in the browser cache when Dart pre-caches it during the boot
       splash. "prefetch" is deliberately low priority — it must not compete
       with flutter_bootstrap.js / canvaskit for bandwidth. -->
  <link rel="prefetch" as="image" href="assets/assets/momentum/intro/rocket.png">
  <link rel="prefetch" as="image" href="assets/assets/momentum/intro/screen.png">
  <link rel="prefetch" as="image" href="assets/assets/momentum/intro/earth.png">
  <link rel="prefetch" as="image" href="assets/assets/momentum/intro/rocket_cores.gif">
  <link rel="prefetch" as="image" href="assets/assets/momentum/intro/rocket_glow.gif">
  <link rel="prefetch" as="image" href="assets/assets/momentum/intro/pyramid.gif">

  <!--
    Pre-engine boot screen.

    Everything here is inline — no webfont, no image request, no script file —
    because it has to paint on the very first frame the browser composites.
    Anything needing a round trip would leave the black screen it exists to
    replace. The logo is a 2 KB data URI for the same reason.

    It covers the gap the Dart-side BootSplash cannot: the browser downloading
    main.dart.js and CanvasKit, before any Flutter code exists to draw. Flutter
    fires `flutter-first-frame` on window once the engine paints, which is where
    we hand over.

    #06070D == MM.pageBg. The body background is also set so no white shows
    through the host page during a maximize/resize repaint.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #06070D;
    }

    #mm-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #06070D;
      /* Mirrors StarfieldBackground's nebula stack so the handover to the
         Dart splash is not a visible jump. */
      background-image:
        radial-gradient(circle at 50% -10%, rgba(31,154,214,0.18), transparent 60%),
        radial-gradient(circle at 50% 110%, rgba(155,92,255,0.15), transparent 60%);
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      opacity: 1;
      transition: opacity 450ms ease;
    }

    #mm-boot.mm-hide { opacity: 0; pointer-events: none; }

    .mm-mark-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 168px;
      height: 132px;
    }

    /* Glow pulse behind the mark. */
    .mm-mark-wrap::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(31,154,214,0.34), transparent 68%);
      animation: mm-pulse 2.4s ease-in-out infinite;
    }

    .mm-mark {
      position: relative;
      width: 104px;
      height: auto;
      image-rendering: auto;
      animation: mm-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .mm-word {
      margin-top: 6px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 4px;
      animation: mm-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 140ms both;
    }
    .mm-word .r { color: #E8112D; }  /* Ignition Red */
    .mm-word .b { color: #1F9AD6; }  /* Momentum Blue */

    .mm-tag {
      margin-top: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.42);
      animation: mm-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 260ms both;
    }

    /* Indeterminate bar — we cannot know real download progress here, so it
       reads as activity rather than faking a percentage. */
    .mm-bar {
      position: relative;
      margin-top: 30px;
      width: 190px;
      height: 3px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(255,255,255,0.10);
    }
    .mm-bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 42%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #1F9AD6, #6FD0FF, transparent);
      animation: mm-sweep 1.35s ease-in-out infinite;
    }

    .mm-status {
      margin-top: 16px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.34);
    }

    @keyframes mm-pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.86); }
      50%      { opacity: 1;    transform: scale(1.06); }
    }
    @keyframes mm-rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes mm-sweep {
      0%   { left: -45%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mm-mark-wrap::before, .mm-mark, .mm-word, .mm-tag, .mm-bar::after {
        animation: none;
      }
      .mm-bar::after { left: 0; width: 100%; }
    }
  </style>
</head>
<body>

    </div>
    <div class="mm-word"><span class="r">MOORE</span><span class="b">MOMENTUM</span></div>
    <div class="mm-tag">MOMENTUM OS</div>
    <div class="mm-bar"></div>
    <div class="mm-status">INITIALIZING FLIGHT SYSTEMS</div>
  </div>

  <script>
    (function () {
      var gone = false;
      function dismiss() {
        if (gone) return;
        gone = true;
        var el = document.getElementById('mm-boot');
        if (!el) return;
        el.classList.add('mm-hide');
        // Drop it from the DOM after the fade so it can never eat pointer
        // events or hold a compositor layer for the rest of the session.
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 500);
      }
      // The engine's own signal: fired once Flutter has painted its first
      // frame, which is exactly when the Dart BootSplash becomes visible.
      window.addEventListener('flutter-first-frame', dismiss);
      // Belt and braces. If the engine fails to boot at all, the user gets the
      // app's black background rather than a loader spinning forever.
      setTimeout(dismiss, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
